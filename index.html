
<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Time Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #151d33;
      --panel-2: #1f2a47;
      --text: #eef3ff;
      --muted: #a9b7d5;
      --s: #38bdf8;
      --m: #a78bfa;
      --l: #fb7185;
      --outlier: #94a3b8;
      --p50: #22c55e;
      --p85: #f59e0b;
      --p95: #ef4444;
    }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #0b1020, #0f172a);
      color: var(--text);
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 16px 32px;
    }
    .panel {
      background: rgba(21, 29, 51, 0.9);
      border: 1px solid #2a3557;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      backdrop-filter: blur(4px);
    }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    p { margin: 0 0 8px; color: var(--muted); }
    .controls, .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: center;
    }
    .controls label, .metrics span {
      background: var(--panel-2);
      border: 1px solid #34436d;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.92rem;
      color: var(--text);
    }
    .controls input[type="checkbox"] { margin-right: 6px; }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    #chart {
      width: 100%;
      height: 560px;
    }
    form {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr)) auto;
      gap: 10px;
      align-items: end;
    }
    .field label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #405080;
      background: #0f172a;
      color: var(--text);
      padding: 9px 10px;
      font-size: 0.95rem;
    }
    button {
      cursor: pointer;
      background: #2563eb;
      border-color: #1d4ed8;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    #status { min-height: 20px; font-size: 0.9rem; color: var(--muted); }
    @media (max-width: 900px) {
      form { grid-template-columns: 1fr 1fr; }
      #chart { height: 500px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Dashboard Lead Time (scatterplot)</h1>
      <p>Kliknij punkt, aby oznaczyć/usunąć outlier; kliknij ponownie, aby przywrócić.</p>
      <div class="controls">
        <label><input type="checkbox" class="size-filter" value="S" checked><span class="legend-dot" style="background: var(--s)"></span>S</label>
        <label><input type="checkbox" class="size-filter" value="M" checked><span class="legend-dot" style="background: var(--m)"></span>M</label>
        <label><input type="checkbox" class="size-filter" value="L" checked><span class="legend-dot" style="background: var(--l)"></span>L</label>
      </div>
    </div>

    <div class="panel metrics" id="metrics"></div>

    <div class="panel">
      <div id="chart"></div>
    </div>

    <div class="panel">
      <form id="add-point-form">
        <div class="field">
          <label for="new-size">Rozmiar</label>
          <select id="new-size" required>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
          </select>
        </div>
        <div class="field">
          <label for="new-time">Czas realizacji</label>
          <input id="new-time" type="number" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label for="new-date">Data ukończenia</label>
          <input id="new-date" type="date" required>
        </div>
        <div class="field">
          <label for="new-note">Źródło</label>
          <input id="new-note" type="text" value="manual">
        </div>
        <button type="submit">Dodaj punkt</button>
      </form>
      <p id="status"></p>
    </div>
  </div>

  <script>
    const WORKBOOK_PATH = "Lead Times - 2024-25.xlsx";
    const STORAGE_KEY = "lead-time-dashboard-v1";
    const SIZE_COLORS = { S: "#38bdf8", M: "#a78bfa", L: "#fb7185" };
    const POLISH_MONTHS = {
      stycznia: 0, lutego: 1, marca: 2, kwietnia: 3, maja: 4, czerwca: 5,
      lipca: 6, sierpnia: 7, września: 8, pazdziernika: 9, października: 9,
      listopada: 10, grudnia: 11
    };

    let points = [];
    let excludedIds = new Set();
    let userAdded = [];

    function setStatus(msg) {
      document.getElementById("status").textContent = msg || "";
    }

    function parseExcelDate(value) {
      if (value instanceof Date && !Number.isNaN(value.getTime())) return value;
      if (typeof value === "number") {
        const utcMillis = Math.round((value - 25569) * 86400 * 1000);
        return new Date(utcMillis);
      }
      if (typeof value === "string") {
        const m = value.trim().toLowerCase().match(/^(\d{1,2})\s+([a-ząćęłńóśźż]+)\s+(\d{4})$/);
        if (m && POLISH_MONTHS[m[2]] !== undefined) {
          return new Date(Date.UTC(Number(m[3]), POLISH_MONTHS[m[2]], Number(m[1])));
        }
        if (/^\d{4}-\d{2}-\d{2}/.test(value)) {
          const d = new Date(value);
          if (!Number.isNaN(d.getTime())) return d;
        }
      }
      return null;
    }

    function toIsoDate(d) {
      return d.toISOString().slice(0, 10);
    }

    function percentile(sortedValues, p) {
      if (!sortedValues.length) return null;
      if (sortedValues.length === 1) return sortedValues[0];
      const idx = (p / 100) * (sortedValues.length - 1);
      const lo = Math.floor(idx);
      const hi = Math.ceil(idx);
      const frac = idx - lo;
      if (lo === hi) return sortedValues[lo];
      return sortedValues[lo] * (1 - frac) + sortedValues[hi] * frac;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        excludedIds = new Set(Array.isArray(parsed.excludedIds) ? parsed.excludedIds : []);
        userAdded = Array.isArray(parsed.userAdded) ? parsed.userAdded : [];
      } catch {
        excludedIds = new Set();
        userAdded = [];
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        excludedIds: [...excludedIds],
        userAdded
      }));
    }

    async function loadWorkbookRows() {
      const res = await fetch(encodeURI(WORKBOOK_PATH));
      if (!res.ok) throw new Error(`Nie można wczytać pliku: ${WORKBOOK_PATH}`);
      const buffer = await res.arrayBuffer();
      const wb = XLSX.read(buffer, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      return XLSX.utils.sheet_to_json(sheet, { defval: null });
    }

    function normalizeRows(rows) {
      return rows
        .map((row, idx) => {
          const dateRaw = row["Data ukończenia"];
          const sizeRaw = (row["Deklarowany rozmiar"] ?? "").toString().trim().toUpperCase();
          const leadRaw = Number(row["Czas realizacji"]);
          const date = parseExcelDate(dateRaw);
          if (!date || !["S", "M", "L"].includes(sizeRaw) || Number.isNaN(leadRaw)) return null;
          return {
            id: `base-${idx + 1}`,
            date: toIsoDate(date),
            size: sizeRaw,
            leadTime: leadRaw,
            source: "xlsx"
          };
        })
        .filter(Boolean);
    }

    function rebuildPoints(baseRows) {
      points = [...baseRows, ...userAdded];
    }

    function currentSizeFilter() {
      const selected = new Set(
        [...document.querySelectorAll(".size-filter:checked")].map((el) => el.value)
      );
      return (p) => selected.has(p.size);
    }

    function render() {
      const sizeFilter = currentSizeFilter();
      const filtered = points.filter(sizeFilter);
      const included = filtered.filter((p) => !excludedIds.has(p.id));
      const excluded = filtered.filter((p) => excludedIds.has(p.id));

      const traces = [];
      for (const size of ["S", "M", "L"]) {
        const active = included.filter((p) => p.size === size);
        if (active.length) {
          traces.push({
            type: "scatter",
            mode: "markers",
            name: size,
            x: active.map((p) => p.date),
            y: active.map((p) => p.leadTime),
            text: active.map((p) => `${p.size} • ${p.leadTime} • ${p.date}`),
            customdata: active.map((p) => p.id),
            marker: { color: SIZE_COLORS[size], size: 10, opacity: 0.95 },
            hovertemplate: "%{text}<extra>Aktywny</extra>"
          });
        }

        const muted = excluded.filter((p) => p.size === size);
        if (muted.length) {
          traces.push({
            type: "scatter",
            mode: "markers",
            name: `${size} (outlier)`,
            x: muted.map((p) => p.date),
            y: muted.map((p) => p.leadTime),
            text: muted.map((p) => `${p.size} • ${p.leadTime} • ${p.date}`),
            customdata: muted.map((p) => p.id),
            marker: {
              color: "#94a3b8",
              size: 10,
              symbol: "x",
              line: { color: SIZE_COLORS[size], width: 1 }
            },
            hovertemplate: "%{text}<extra>Outlier</extra>"
          });
        }
      }

      const values = included.map((p) => p.leadTime).sort((a, b) => a - b);
      const p50 = percentile(values, 50);
      const p85 = percentile(values, 85);
      const p95 = percentile(values, 95);

      const shapes = [];
      if (p50 !== null) shapes.push({ type: "line", x0: 0, x1: 1, xref: "paper", y0: p50, y1: p50, line: { color: "#22c55e", width: 2, dash: "dot" } });
      if (p85 !== null) shapes.push({ type: "line", x0: 0, x1: 1, xref: "paper", y0: p85, y1: p85, line: { color: "#f59e0b", width: 2, dash: "dash" } });
      if (p95 !== null) shapes.push({ type: "line", x0: 0, x1: 1, xref: "paper", y0: p95, y1: p95, line: { color: "#ef4444", width: 2, dash: "dashdot" } });

      const layout = {
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(15,23,42,0.75)",
        font: { color: "#eef3ff" },
        legend: { orientation: "h", y: 1.08 },
        margin: { l: 55, r: 20, t: 40, b: 60 },
        xaxis: { title: "Data ukończenia", type: "date", gridcolor: "rgba(148,163,184,0.18)" },
        yaxis: { title: "Czas realizacji", gridcolor: "rgba(148,163,184,0.18)" },
        shapes
      };

      Plotly.react("chart", traces, layout, { responsive: true, displaylogo: false });

      const metric = document.getElementById("metrics");
      metric.innerHTML = [
        `<span><strong>P50:</strong> ${p50 === null ? "—" : p50.toFixed(2)}</span>`,
        `<span><strong>P85:</strong> ${p85 === null ? "—" : p85.toFixed(2)}</span>`,
        `<span><strong>P95:</strong> ${p95 === null ? "—" : p95.toFixed(2)}</span>`,
        `<span><strong>Aktywne:</strong> ${included.length}</span>`,
        `<span><strong>Outliery:</strong> ${excluded.length}</span>`
      ].join("");
    }

    function attachChartClickHandler() {
      const chart = document.getElementById("chart");
      chart.on("plotly_click", (eventData) => {
        const point = eventData?.points?.[0];
        if (!point) return;
        const id = point.customdata;
        if (!id) return;
        if (excludedIds.has(id)) excludedIds.delete(id);
        else excludedIds.add(id);
        saveState();
        render();
      });
    }

    function attachFormHandler() {
      const form = document.getElementById("add-point-form");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const size = document.getElementById("new-size").value;
        const leadTime = Number(document.getElementById("new-time").value);
        const date = document.getElementById("new-date").value;
        const source = (document.getElementById("new-note").value || "manual").trim();

        if (!["S", "M", "L"].includes(size)) return setStatus("Nieprawidłowy rozmiar.");
        if (Number.isNaN(leadTime) || leadTime < 0) return setStatus("Czas realizacji musi być >= 0.");
        if (!date) return setStatus("Podaj datę ukończenia.");

        const id = `user-${Date.now()}-${Math.floor(Math.random() * 1e5)}`;
        userAdded.push({ id, date, size, leadTime, source });
        saveState();
        rebuildPoints(points.filter((p) => p.source === "xlsx"));
        render();
        form.reset();
        document.getElementById("new-size").value = "S";
        setStatus("Dodano punkt danych.");
      });
    }

    async function init() {
      try {
        loadState();
        const rows = await loadWorkbookRows();
        const baseRows = normalizeRows(rows);
        rebuildPoints(baseRows);

        document.querySelectorAll(".size-filter").forEach((el) => {
          el.addEventListener("change", render);
        });

        render();
        attachChartClickHandler();
        attachFormHandler();
        setStatus(`Wczytano ${baseRows.length} rekordów z XLSX.`);
      } catch (err) {
        setStatus(err.message || "Błąd inicjalizacji dashboardu.");
      }
    }

    init();
  </script>
</body>
</html>
